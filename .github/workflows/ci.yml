name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      # The same scripts a developer runs locally, so CI and local builds cannot drift apart.
      - name: Build the app
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release
      - name: Run the tests
        shell: pwsh
        run: ./scripts/test.ps1 -Configuration Release -NoBuild
      # The runner image already carries Inno Setup; pinning it means an image update cannot
      # change the installer between two builds of the same commit.
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --allow-downgrade -y --no-progress
      # Packaging runs on every build, so a broken release step shows up in a pull request,
      # not after a tag has been pushed.
      - name: Package the build
        shell: pwsh
        run: ./scripts/package.ps1 -Configuration Release
      - name: Keep the packaged build
        uses: actions/upload-artifact@v7
        with:
          name: QuickPane-x64-Release
          path: dist/
